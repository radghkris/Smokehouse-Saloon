<title>Blackwater Ledger</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Rye&family=Libre+Franklin:wght@400;500;600;700;800&display=swap">
<style>
:root{
  --bg:#f2e9d6;
  --surface:#fbf5e8;
  --surface2:#ece0c4;
  --ink:#2c2013;
  --ink-dim:#6c5c42;
  --line:rgba(44,32,19,.16);
  --line-strong:rgba(44,32,19,.32);
  --accent:#9a3324;
  --accent-ink:#fbf1e2;
  --accent2:#a9762f;
  --good:#3d7a4a;
  --good-bg:rgba(61,122,74,.14);
  --warn:#b0791e;
  --warn-bg:rgba(176,121,30,.16);
  --bad:#a3283f;
  --bad-bg:rgba(163,40,63,.14);
  --shadow:0 1px 2px rgba(44,32,19,.08), 0 6px 20px rgba(44,32,19,.10);
  --radius:10px;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#18130e;
    --surface:#211a13;
    --surface2:#2a2118;
    --ink:#f0e4cd;
    --ink-dim:#b7a483;
    --line:rgba(240,228,205,.14);
    --line-strong:rgba(240,228,205,.26);
    --accent:#d1694b;
    --accent-ink:#1b120c;
    --accent2:#d8a94e;
    --good:#6bc47f;
    --good-bg:rgba(107,196,127,.14);
    --warn:#e0b04b;
    --warn-bg:rgba(224,176,75,.14);
    --bad:#e2708a;
    --bad-bg:rgba(226,112,138,.16);
    --shadow:0 1px 2px rgba(0,0,0,.3), 0 8px 24px rgba(0,0,0,.4);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#18130e;
  --surface:#211a13;
  --surface2:#2a2118;
  --ink:#f0e4cd;
  --ink-dim:#b7a483;
  --line:rgba(240,228,205,.14);
  --line-strong:rgba(240,228,205,.26);
  --accent:#d1694b;
  --accent-ink:#1b120c;
  --accent2:#d8a94e;
  --good:#6bc47f;
  --good-bg:rgba(107,196,127,.14);
  --warn:#e0b04b;
  --warn-bg:rgba(224,176,75,.14);
  --bad:#e2708a;
  --bad-bg:rgba(226,112,138,.16);
  --shadow:0 1px 2px rgba(0,0,0,.3), 0 8px 24px rgba(0,0,0,.4);
  color-scheme:dark;
}
*{box-sizing:border-box;}
body{
  background:var(--bg);
  color:var(--ink);
  font-family:'Libre Franklin',-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;
  padding-inline:16px;
  padding-block:18px 48px;
  min-height:100%;
}
h1,h2,h3{font-family:'Rye',Georgia,'Times New Roman',serif; font-weight:400; letter-spacing:.3px; margin:0;}
.num{font-variant-numeric:tabular-nums;}
.wrap{max-width:1180px; margin:0 auto;}
header.top{
  display:flex; align-items:baseline; gap:12px; flex-wrap:wrap;
  padding-bottom:14px; margin-bottom:16px; border-bottom:2px solid var(--line-strong);
}
header.top h1{font-size:clamp(1.5rem,1.1rem + 1.6vw,2.2rem); color:var(--accent);}
header.top .tag{color:var(--ink-dim); font-size:.85rem;}
nav.tabs{
  display:flex; gap:6px; overflow-x:auto; padding-bottom:4px; margin-bottom:18px;
  scrollbar-width:thin;
}
nav.tabs button{
  flex:0 0 auto; font-family:inherit; font-size:.86rem; font-weight:600;
  padding:8px 14px; border-radius:999px; border:1px solid var(--line);
  background:var(--surface); color:var(--ink-dim); cursor:pointer; white-space:nowrap;
}
nav.tabs button.active{background:var(--accent); border-color:var(--accent); color:var(--accent-ink);}
nav.tabs button:hover:not(.active){border-color:var(--line-strong); color:var(--ink);}
.card{
  background:var(--surface); border:1px solid var(--line); border-radius:var(--radius);
  padding:16px; box-shadow:var(--shadow);
}
.section-head{display:flex; align-items:center; justify-content:space-between; gap:10px; margin-bottom:12px; flex-wrap:wrap;}
.section-head h2{font-size:1.3rem;}
.section-head p.hint{color:var(--ink-dim); font-size:.82rem; margin:2px 0 0;}
.grid{display:grid; gap:14px;}
.grid.tiles{grid-template-columns:repeat(auto-fit,minmax(150px,1fr));}
.tile{
  background:var(--surface); border:1px solid var(--line); border-radius:var(--radius);
  padding:14px; box-shadow:var(--shadow);
}
.tile .label{font-size:.74rem; text-transform:uppercase; letter-spacing:.06em; color:var(--ink-dim); font-weight:600;}
.tile .value{font-size:1.6rem; font-weight:700; margin-top:4px;}
.tile .value.good{color:var(--good);} .tile .value.warn{color:var(--warn);} .tile .value.bad{color:var(--bad);}
.btn{
  font-family:inherit; font-weight:600; font-size:.84rem; padding:8px 14px; border-radius:8px;
  border:1px solid var(--line-strong); background:var(--surface2); color:var(--ink); cursor:pointer;
}
.btn:hover{border-color:var(--accent);}
.btn.primary{background:var(--accent); border-color:var(--accent); color:var(--accent-ink);}
.btn.primary:hover{filter:brightness(1.08);}
.btn.ghost{background:transparent; border-color:transparent; padding:6px 8px;}
.btn.danger{color:var(--bad);}
.btn.small{padding:5px 10px; font-size:.76rem;}
.btn:disabled{opacity:.55; cursor:default;}
table{width:100%; border-collapse:collapse; font-size:.86rem;}
th{text-align:left; color:var(--ink-dim); font-size:.72rem; text-transform:uppercase; letter-spacing:.05em; padding:6px 8px; border-bottom:1px solid var(--line-strong); white-space:nowrap;}
td{padding:7px 8px; border-bottom:1px solid var(--line); vertical-align:middle;}
tr:last-child td{border-bottom:none;}
.table-wrap{overflow-x:auto; margin:-4px -4px 0;}
.badge{display:inline-flex; align-items:center; gap:4px; padding:2px 9px; border-radius:999px; font-size:.72rem; font-weight:700; text-transform:uppercase; letter-spacing:.04em;}
.badge.good{background:var(--good-bg); color:var(--good);}
.badge.warn{background:var(--warn-bg); color:var(--warn);}
.badge.bad{background:var(--bad-bg); color:var(--bad);}
.badge.muted{background:var(--surface2); color:var(--ink-dim);}
input,select{
  font-family:inherit; font-size:.86rem; padding:6px 8px; border-radius:6px;
  border:1px solid var(--line-strong); background:var(--surface); color:var(--ink);
}
input[type=number]{width:6.5em;}
input:focus,select:focus{outline:2px solid var(--accent); outline-offset:1px;}
.field{display:flex; flex-direction:column; gap:4px; margin-bottom:10px;}
.field label{font-size:.76rem; font-weight:600; color:var(--ink-dim);}
.field-row{display:flex; gap:10px; flex-wrap:wrap;}
.field-row .field{flex:1; min-width:130px;}
.ing-line{display:flex; gap:8px; align-items:center; margin-bottom:6px; flex-wrap:wrap;}
.ing-line select{flex:1; min-width:140px;}
.overlay{
  position:fixed; inset:0; background:rgba(20,14,8,.55); display:flex; align-items:flex-start;
  justify-content:center; padding:5vh 16px; overflow-y:auto; z-index:50;
}
.modal{
  background:var(--surface); border:1px solid var(--line-strong); border-radius:var(--radius);
  box-shadow:var(--shadow); width:100%; max-width:480px; padding:20px;
}
.modal h3{font-size:1.15rem; margin-bottom:14px; color:var(--accent);}
.modal .actions{display:flex; justify-content:flex-end; gap:8px; margin-top:14px;}
.star-btn{background:none; border:none; cursor:pointer; font-size:1rem; padding:2px; color:var(--ink-dim);}
.star-btn.on{color:var(--accent2);}
.banner{
  background:var(--warn-bg); color:var(--warn); border:1px solid var(--warn);
  border-radius:8px; padding:10px 14px; font-size:.84rem; margin-bottom:16px;
}
.muted{color:var(--ink-dim);}
.right{text-align:right;}
.center{text-align:center;}
.empty{color:var(--ink-dim); font-size:.85rem; padding:16px 4px;}
.stack{display:flex; flex-direction:column; gap:14px;}
.two-col{display:grid; grid-template-columns:1.3fr 1fr; gap:14px;}
@media (max-width:820px){ .two-col{grid-template-columns:1fr;} }
.chip-row{display:flex; gap:6px; flex-wrap:wrap;}
.foot-note{color:var(--ink-dim); font-size:.76rem; margin-top:10px;}
.subhead{font-size:.95rem; font-weight:700; margin:2px 0 8px; color:var(--ink);}
</style>

<div class="wrap">
  <header class="top">
    <h1>Blackwater Ledger</h1>
    <span class="tag">The Smokehouse — costing &amp; production planner</span>
  </header>
  <nav class="tabs" id="tabs"></nav>
  <div id="banner"></div>
  <main id="app"><div class="empty">Loading the ledger…</div></main>
</div>
<div id="modalRoot"></div>

<script>
(function(){
'use strict';

/* ---------- seed data ---------- */
var ING = [
  ['tea-leaf','Tea Leaf','ea'],['orange','Orange','ea'],['sugar','Sugar','ea'],['water','Water','ea'],
  ['coca-leaf','Coca Leaf','ea'],['lime','Lime','ea'],['prepared-meat-cut','Prepared Meat Cut','ea'],
  ['beans','Beans','ea'],['pimenta','Pimenta','ea'],['tomato','Tomato','ea'],['whisky','Whisky','ea'],
  ['barley','Barley','ea'],['cherry','Cherry','ea'],['potato','Potato','ea'],['corn','Corn','ea'],
  ['wheat','Wheat','ea'],['onion','Onion','ea'],['milk','Milk','ea'],['carrot','Carrot','ea'],
  ['creeping-thyme','Creeping Thyme','ea'],['coffee-beans','Coffee Beans','ea'],['sugarcane','Sugarcane','ea']
];
var CROP_CHEAP = ['tea-leaf','orange','sugarcane','lime','beans','pimenta','tomato','barley','cherry','potato','corn','wheat','onion','carrot','creeping-thyme','coffee-beans','coca-leaf'];
var RECIPES = [
  ['sun-brewed-sweet-tea','Sun-Brewed Sweet Tea','drink',1,true,[['tea-leaf',2],['orange',1],['sugar',1],['water',1]]],
  ['blackwater-coca-tonic','Blackwater Coca Tonic','drink',1,false,[['coca-leaf',1],['sugar',1],['lime',1],['water',1]]],
  ['buck-country-chili','Buck Country Chili','food',1,true,[['prepared-meat-cut',2],['beans',2],['pimenta',1],['tomato',1]]],
  ['irishmans-dram','Irishman’s Dram','drink',1,true,[['whisky',2],['barley',1]]],
  ['blackwater-old-fashioned','Blackwater Old Fashioned','drink',1,true,[['whisky',1],['orange',1],['cherry',1],['sugar',1]]],
  ['brunswick-stew','Brunswick Stew','food',1,true,[['prepared-meat-cut',2],['potato',1],['corn',1],['tomato',1]]],
  ['cattlemans-ruin','Cattleman’s Ruin','food',3,true,[['prepared-meat-cut',3],['wheat',2],['onion',1],['sugar',1]]],
  ['mamas-chicken-dumplings','Mama’s Chicken & Dumplings','food',1,true,[['prepared-meat-cut',2],['wheat',2],['milk',1],['carrot',1]]],
  ['dirty-weenies','Dirty Weenies','food',1,true,[['prepared-meat-cut',2],['beans',2],['onion',1],['sugar',1]]],
  ['backcountry-cottontail-stew','Backcountry Cottontail Stew','food',1,true,[['prepared-meat-cut',2],['potato',1],['carrot',1],['creeping-thyme',1]]],
  ['drovers-onion-crock','Drover’s Onion Crock','food',1,true,[['onion',3],['wheat',2],['milk',1]]],
  ['frontier-sarsaparilla','Frontier Sarsaparilla','drink',1,true,[['barley',1],['sugar',1],['water',1]]],
  ['pappys-cane-coffee','Pappy’s Cane Coffee','drink',1,true,[['coffee-beans',2],['sugar',4],['water',1]]]
];
var DEFAULT_SETTINGS = {
  priceCap:0.45, thresholdHealthy:0.20, thresholdTight:0.30,
  meatIngredientId:'prepared-meat-cut', meatMode:'calculated',
  meatRawCost:0, meatProcessingFee:0.03, meatOverrideCost:0.08
};

function slugify(s){ return (s||'').toLowerCase().trim().replace(/[^a-z0-9]+/g,'-').replace(/^-+|-+$/g,'') || 'item'; }
function uniqueId(base, existing){ var id=base, n=2; while(existing.has(id)){ id=base+'-'+n; n++; } return id; }
function fmt$(n){ if(n==null||isNaN(n)) return '—'; return '$'+n.toFixed(2); }
function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }
function round2(n){ return Math.round(n*100)/100; }

/* ---------- state ---------- */
var state = {
  ingredients:{}, conversions:[], vendors:[], recipes:{}, inventory:{},
  plan:{targets:{}}, settings:null, ready:{ing:false,conv:false,ven:false,rec:false,inv:false,plan:false,set:false}
};
var db=null, dbAvailable=true, activeTab='dashboard';

/* ---------- pricing engine ---------- */
function ingCost(id, visiting){
  visiting = visiting || {};
  if(visiting[id]) return {cost:0, warn:true, reason:'circular'};
  var s = state.settings || DEFAULT_SETTINGS;
  if(id === s.meatIngredientId){
    if(s.meatMode === 'override') return {cost:s.meatOverrideCost||0, warn:false, reason:'override'};
    return {cost:(s.meatRawCost||0)+(s.meatProcessingFee||0), warn:false, reason:'calculated'};
  }
  var conv = null;
  for(var i=0;i<state.conversions.length;i++){ if(state.conversions[i].outputId===id){ conv=state.conversions[i]; break; } }
  if(conv){
    var nv = {}; for(var k in visiting) nv[k]=visiting[k]; nv[id]=true;
    var inputRes = ingCost(conv.inputId, nv);
    var outQty = conv.outputQty || 1;
    var cost = (inputRes.cost*(conv.inputQty||1) + (conv.cost||0)) / outQty;
    return {cost:cost, warn:inputRes.warn, reason:'conversion', via:conv.inputId};
  }
  var inv = state.inventory[id];
  var pool = state.vendors.filter(function(v){ return v.ingredientId===id && v.price!=null; });
  var vendor = null;
  if(inv && inv.preferredVendorId){
    for(var j=0;j<state.vendors.length;j++){ if(state.vendors[j].id===inv.preferredVendorId && state.vendors[j].price!=null){ vendor=state.vendors[j]; break; } }
  }
  if(!vendor && pool.length){ vendor = pool.slice().sort(function(a,b){return a.price-b.price;})[0]; }
  if(vendor) return {cost:vendor.price, warn:false, reason:'vendor', vendorId:vendor.id};
  return {cost:0, warn:true, reason:'no-price'};
}
function cheapestVendor(id){
  var pool = state.vendors.filter(function(v){ return v.ingredientId===id && v.price!=null; });
  if(!pool.length) return null;
  return pool.slice().sort(function(a,b){return a.price-b.price;})[0];
}
function ingName(id){ var i = state.ingredients[id]; return i ? i.name : id; }
/* Walks shortages down through conversions to the actual purchasable (or huntable) source. */
function resolvePurchaseSteps(id, qty){
  var steps=[], visiting={}, curId=id, curQty=qty, guard=0;
  while(guard++<20){
    if(visiting[curId]){ steps.push({type:'circular', ingredientId:curId, qty:curQty}); break; }
    visiting[curId]=true;
    if(curId === state.settings.meatIngredientId){
      steps.push({type:'hunt', ingredientId:curId, qty:curQty});
      break;
    }
    var conv=null;
    for(var i=0;i<state.conversions.length;i++){ if(state.conversions[i].outputId===curId){ conv=state.conversions[i]; break; } }
    if(conv){
      var inputQtyNeeded = Math.ceil(curQty/(conv.outputQty||1)) * (conv.inputQty||1);
      steps.push({type:'convert', fromId:conv.inputId, fromQty:inputQtyNeeded, outputId:curId, outputQty:curQty});
      curId = conv.inputId; curQty = inputQtyNeeded;
      continue;
    }
    var inv = state.inventory[curId];
    var vendor = null;
    if(inv && inv.preferredVendorId){ vendor = state.vendors.filter(function(v){return v.id===inv.preferredVendorId && v.price!=null;})[0]; }
    if(!vendor) vendor = cheapestVendor(curId);
    if(vendor) steps.push({type:'buy', ingredientId:curId, qty:curQty, vendor:vendor});
    else steps.push({type:'no-source', ingredientId:curId, qty:curQty});
    break;
  }
  return steps;
}
function orderLineHtml(topId, shortageQty){
  var steps = resolvePurchaseSteps(topId, shortageQty);
  var last = steps[steps.length-1];
  var mainTxt, sub='';
  if(last.type==='hunt'){
    mainTxt = '<strong>Go Hunting</strong> <span class="muted">— Valentine for processing</span>';
  } else if(last.type==='buy'){
    var v = last.vendor;
    mainTxt = 'Buy <strong>'+last.qty+'</strong> '+esc(ingName(last.ingredientId))+' — '+esc(v.vendorName)+(v.town?' ('+esc(v.town)+')':'')+' @ '+fmt$(v.price)+'/ea = '+fmt$(v.price*last.qty);
  } else if(last.type==='no-source'){
    mainTxt = '<span class="badge warn">no price set</span> for '+esc(ingName(last.ingredientId))+' — add a vendor';
  } else {
    mainTxt = '<span class="badge bad">circular conversion</span> on '+esc(ingName(last.ingredientId));
  }
  if(steps.length>1){
    sub = ' <span class="muted">(via '+steps.slice(0,-1).map(function(s){ return s.outputQty+' '+esc(ingName(s.outputId))+' ← '+s.fromQty+' '+esc(ingName(s.fromId)); }).join(', ')+')</span>';
  }
  return mainTxt+sub;
}
function recipeCraftCost(r){
  var total=0, warn=false, lines=[];
  (r.ingredients||[]).forEach(function(ri){
    var res = ingCost(ri.ingredientId);
    warn = warn || res.warn;
    var lineCost = res.cost*ri.qty;
    total += lineCost;
    lines.push({ingredientId:ri.ingredientId, qty:ri.qty, unitCost:res.cost, lineCost:lineCost, warn:res.warn});
  });
  return {total:total, lines:lines, warn:warn};
}
function recipeMetrics(r){
  var craft = recipeCraftCost(r);
  var yieldQty = r.yieldQty>0 ? r.yieldQty : 1;
  var costPerItem = craft.total/yieldQty;
  var sale = r.salePrice||0;
  var profit = sale-costPerItem;
  var margin = sale>0 ? profit/sale : null;
  var tier = 'good';
  var s = state.settings||DEFAULT_SETTINGS;
  if(costPerItem > s.thresholdTight) tier='bad';
  else if(costPerItem > s.thresholdHealthy) tier='warn';
  return {craft:craft, costPerItem:costPerItem, profit:profit, margin:margin, tier:tier, overCap: sale>s.priceCap};
}
function computePlan(){
  var rows=[], ingredientTotals={};
  Object.keys(state.recipes).forEach(function(id){
    var r = state.recipes[id];
    var t = state.plan.targets[id];
    if(!t || !t.enabled || !(t.qty>0)) return;
    var yieldQty = r.yieldQty>0?r.yieldQty:1;
    var crafts = Math.ceil(t.qty/yieldQty);
    var craft = recipeCraftCost(r);
    rows.push({recipe:r, target:t.qty, crafts:crafts, craftCost:craft.total, runCost:crafts*craft.total, warn:craft.warn});
    (r.ingredients||[]).forEach(function(ri){
      var need = crafts*ri.qty;
      if(!ingredientTotals[ri.ingredientId]) ingredientTotals[ri.ingredientId] = {required:0, recipeIds:{}};
      ingredientTotals[ri.ingredientId].required += need;
      ingredientTotals[ri.ingredientId].recipeIds[id]=true;
    });
  });
  var shortages = Object.keys(ingredientTotals).map(function(id){
    var d = ingredientTotals[id];
    var onHand = (state.inventory[id] && state.inventory[id].qty) || 0;
    var shortage = Math.max(0, d.required-onHand);
    var numRecipes = Object.keys(d.recipeIds).length;
    return {id:id, required:d.required, onHand:onHand, shortage:shortage, numRecipes:numRecipes, score:shortage*numRecipes};
  }).sort(function(a,b){ return b.shortage-a.shortage; });
  var growNext = shortages.filter(function(s){return s.shortage>0;}).sort(function(a,b){return b.score-a.score;}).slice(0,5);
  return {rows:rows, shortages:shortages, growNext:growNext};
}

/* ---------- usages / guards ---------- */
function usedInRecipes(ingId){
  return Object.values(state.recipes).filter(function(r){ return (r.ingredients||[]).some(function(ri){return ri.ingredientId===ingId;}); });
}
function usedInConversions(ingId){
  return state.conversions.filter(function(c){ return c.inputId===ingId || c.outputId===ingId; });
}

/* ---------- db bootstrap ---------- */
async function seedIfEmpty(){
  var snap = await db.doc('settings/main').get();
  if(snap.exists) return;
  var ingCol = db.collection('ingredients');
  await Promise.all(ING.map(function(row){ return ingCol.doc(row[0]).set({name:row[1], unit:row[2]}); }));
  var invCol = db.collection('inventory');
  await Promise.all(ING.map(function(row){ return invCol.doc(row[0]).set({qty:0, preferredVendorId:null}); }));
  var venCol = db.collection('vendors');
  var venWrites = [];
  CROP_CHEAP.forEach(function(id){
    venWrites.push(venCol.add({ingredientId:id, vendorName:'Armadillo Market', town:'Armadillo', price:0.10, stock:'unknown'}));
    venWrites.push(venCol.add({ingredientId:id, vendorName:'Valentine Market', town:'Valentine', price:0.32, stock:'unknown', note:'being rechecked'}));
  });
  venWrites.push(venCol.add({ingredientId:'milk', vendorName:'Armadillo Market', town:'Armadillo', price:0.25, stock:'unknown'}));
  venWrites.push(venCol.add({ingredientId:'whisky', vendorName:'General Store', town:'', price:null, stock:'unknown', note:'price TBD'}));
  venWrites.push(venCol.add({ingredientId:'water', vendorName:'Local Market', town:'', price:null, stock:'unknown', note:'price TBD / stock dependent'}));
  await Promise.all(venWrites);
  var convCol = db.collection('conversions');
  await convCol.add({inputId:'sugarcane', inputQty:1, outputId:'sugar', outputQty:5, cost:0, note:'1 Sugarcane → 5 Sugar'});
  var recCol = db.collection('recipes');
  await Promise.all(RECIPES.map(function(row){
    return recCol.doc(row[0]).set({
      name:row[1], category:row[2], yieldQty:row[3], salePrice:0.45, active:row[4],
      ingredients: row[5].map(function(p){ return {ingredientId:p[0], qty:p[1]}; })
    });
  }));
  var targets = {};
  RECIPES.forEach(function(row){ targets[row[0]] = {enabled:row[4], qty:100}; });
  await db.doc('plan/current').set({targets:targets});
  await db.doc('settings/main').set(DEFAULT_SETTINGS);
}

function allReady(){
  var r = state.ready;
  return r.ing&&r.conv&&r.ven&&r.rec&&r.inv&&r.plan&&r.set;
}

async function boot(){
  try{
    db = await claude.use('db');
  }catch(e){ db=null; }
  if(!db){
    dbAvailable=false;
    state.settings = Object.assign({}, DEFAULT_SETTINGS);
    var invSeed={}; ING.forEach(function(row){ state.ingredients[row[0]]={id:row[0],name:row[1],unit:row[2]}; invSeed[row[0]]={qty:0,preferredVendorId:null}; });
    state.inventory = invSeed;
    state.vendors=[]; state.conversions=[];
    var targets2={};
    RECIPES.forEach(function(row){ state.recipes[row[0]]={id:row[0],name:row[1],category:row[2],yieldQty:row[3],salePrice:0.45,active:row[4],ingredients:row[5].map(function(p){return {ingredientId:p[0],qty:p[1]};})}; targets2[row[0]]={enabled:row[4],qty:100}; });
    state.plan={targets:targets2};
    renderBanner();
    renderTabs(); render();
    return;
  }
  try{
    await seedIfEmpty();
  }catch(e){ console.error('seed failed', e); }

  db.collection('ingredients').onSnapshot(function(qs){
    var map={}; qs.docs.forEach(function(d){ map[d.id]=Object.assign({id:d.id}, d.data()); });
    state.ingredients=map; state.ready.ing=true; render();
  }, function(){ state.ready.ing=true; render(); });

  db.collection('conversions').onSnapshot(function(qs){
    state.conversions = qs.docs.map(function(d){ return Object.assign({id:d.id}, d.data()); });
    state.ready.conv=true; render();
  }, function(){ state.ready.conv=true; render(); });

  db.collection('vendors').onSnapshot(function(qs){
    state.vendors = qs.docs.map(function(d){ return Object.assign({id:d.id}, d.data()); });
    state.ready.ven=true; render();
  }, function(){ state.ready.ven=true; render(); });

  db.collection('recipes').onSnapshot(function(qs){
    var map={}; qs.docs.forEach(function(d){ map[d.id]=Object.assign({id:d.id}, d.data()); });
    state.recipes=map; state.ready.rec=true; render();
  }, function(){ state.ready.rec=true; render(); });

  db.collection('inventory').onSnapshot(function(qs){
    var map={}; qs.docs.forEach(function(d){ map[d.id]=d.data(); });
    state.inventory=map; state.ready.inv=true; render();
  }, function(){ state.ready.inv=true; render(); });

  db.doc('plan/current').onSnapshot(function(snap){
    state.plan = snap.exists ? Object.assign({targets:{}}, snap.data()) : {targets:{}};
    if(!state.plan.targets) state.plan.targets={};
    state.ready.plan=true; render();
  }, function(){ state.ready.plan=true; render(); });

  db.doc('settings/main').onSnapshot(function(snap){
    state.settings = snap.exists ? Object.assign({}, DEFAULT_SETTINGS, snap.data()) : Object.assign({}, DEFAULT_SETTINGS);
    state.ready.set=true; render();
  }, function(){ state.ready.set=true; render(); });

  renderTabs();
}

/* ---------- modal ---------- */
function openModal(title, bodyHtml, onMount){
  var root = document.getElementById('modalRoot');
  root.innerHTML = '<div class="overlay" id="ovl"><div class="modal"><h3>'+esc(title)+'</h3><div id="modalBody">'+bodyHtml+'</div></div></div>';
  document.getElementById('ovl').addEventListener('mousedown', function(e){ if(e.target.id==='ovl') closeModal(); });
  if(onMount) onMount(document.getElementById('modalBody'));
}
function closeModal(){ document.getElementById('modalRoot').innerHTML=''; }

/* ---------- tabs ---------- */
var TABS = [
  ['dashboard','Dashboard'], ['recipes','Recipes'], ['ingredients','Ingredients'],
  ['vendors','Vendors'], ['inventory','Inventory'], ['planner','Planner'], ['settings','Settings']
];
function renderTabs(){
  var nav = document.getElementById('tabs');
  nav.innerHTML = TABS.map(function(t){
    return '<button data-tab="'+t[0]+'" class="'+(activeTab===t[0]?'active':'')+'">'+esc(t[1])+'</button>';
  }).join('');
  Array.prototype.forEach.call(nav.querySelectorAll('button'), function(b){
    b.addEventListener('click', function(){ activeTab=b.getAttribute('data-tab'); renderTabs(); render(); });
  });
}
function renderBanner(){
  var b = document.getElementById('banner');
  if(!dbAvailable){
    b.innerHTML = '<div class="banner">This view has no live data connection, so changes here won’t be saved. Open the published ledger link directly in Claude to edit and keep your data.</div>';
  } else { b.innerHTML=''; }
}

/* ---------- render dispatch ---------- */
function render(){
  renderBanner();
  var app = document.getElementById('app');
  if(dbAvailable && !allReady()){ app.innerHTML = '<div class="empty">Loading the ledger…</div>'; return; }
  if(activeTab==='dashboard') app.innerHTML = viewDashboard();
  else if(activeTab==='recipes') app.innerHTML = viewRecipes();
  else if(activeTab==='ingredients') app.innerHTML = viewIngredients();
  else if(activeTab==='vendors') app.innerHTML = viewVendors();
  else if(activeTab==='inventory') app.innerHTML = viewInventory();
  else if(activeTab==='planner') app.innerHTML = viewPlanner();
  else if(activeTab==='settings') app.innerHTML = viewSettings();
  wireApp();
}

/* ================= DASHBOARD ================= */
function viewDashboard(){
  var recipes = Object.values(state.recipes);
  var active = recipes.filter(function(r){return r.active;});
  var plan = computePlan();
  var overCap=0, problematic=0;
  recipes.forEach(function(r){ var m=recipeMetrics(r); if(m.overCap) overCap++; if(m.tier==='bad') problematic++; });
  var totalShortLines = plan.shortages.filter(function(s){return s.shortage>0;}).length;

  var tiles = ''
    + tile('Active Recipes', active.length+' / '+recipes.length, '')
    + tile('Ingredients Short (planned run)', String(totalShortLines), totalShortLines>0?'bad':'good')
    + tile('Over Price Cap', String(overCap), overCap>0?'bad':'good')
    + tile('Problematic Cost Tier', String(problematic), problematic>0?'warn':'good');

  var growRows = plan.growNext.map(function(g){
    var ing = state.ingredients[g.id];
    return '<tr><td>'+esc(ing?ing.name:g.id)+'</td><td class="num right">'+g.shortage+'</td><td class="num right">'+g.numRecipes+'</td><td class="num right">'+g.score+'</td></tr>';
  }).join('');
  var growTable = plan.growNext.length
    ? '<div class="table-wrap"><table><thead><tr><th>Ingredient</th><th class="right">Shortage</th><th class="right">Recipes Using</th><th class="right">Score</th></tr></thead><tbody>'+growRows+'</tbody></table></div>'
    : '<div class="empty">No shortages against the current plan — you’re stocked.</div>';

  var warnRows = recipes.filter(function(r){ var m=recipeMetrics(r); return m.tier!=='good' || m.overCap; }).map(function(r){
    var m = recipeMetrics(r);
    var badges = (m.overCap?'<span class="badge bad">over cap</span> ':'') + '<span class="badge '+(m.tier==='bad'?'bad':'warn')+'">'+(m.tier==='bad'?'problematic':'tight')+'</span>';
    return '<tr><td>'+esc(r.name)+'</td><td class="num right">'+fmt$(m.costPerItem)+'</td><td class="num right">'+fmt$(r.salePrice)+'</td><td>'+badges+'</td></tr>';
  }).join('');
  var warnTable = warnRows
    ? '<div class="table-wrap"><table><thead><tr><th>Recipe</th><th class="right">Cost / Item</th><th class="right">Sale Price</th><th>Flag</th></tr></thead><tbody>'+warnRows+'</tbody></table></div>'
    : '<div class="empty">Every recipe is under the tight-cost threshold and within the price cap.</div>';

  return '<div class="stack">'
    + '<div class="grid tiles">'+tiles+'</div>'
    + '<div class="two-col">'
      + '<div class="card"><div class="section-head"><h2>Grow Next</h2><p class="hint">Top shortages, weighted by how many planned recipes need them.</p></div>'+growTable+'</div>'
      + '<div class="card"><div class="section-head"><h2>Pricing Watch</h2><p class="hint">Cap: '+fmt$(state.settings.priceCap)+' · Tight: over '+fmt$(state.settings.thresholdHealthy)+' · Problematic: over '+fmt$(state.settings.thresholdTight)+'</p></div>'+warnTable+'</div>'
    + '</div>'
  + '</div>';
}
function tile(label, value, cls){
  return '<div class="tile"><div class="label">'+esc(label)+'</div><div class="value '+(cls||'')+'">'+esc(value)+'</div></div>';
}

        + '<td>'+esc(v.vendorName)+'</td><td class="muted">'+esc(v.town||'—')+'</td>'
        + '<td class="num right">'+(v.price==null?'<span class="muted">TBD</span>':fmt$(v.price))+(isCheapest?' <span class="badge good">cheapest</span>':'')+'</td>'
        + '<td>'+stockBadge(v.stock)+'</td>'
        + '<td><button class="star-btn '+(isPreferred?'on':'')+'" title="Preferred supplier" data-act="pref-vendor" data-id="'+id+'" data-vendor="'+v.id+'">'+(isPreferred?'★':'☆')+'</button></td>'
        + '<td><button class="btn small danger" data-act="del-vendor" data-id="'+v.id+'">Delete</button></td>'
        + '</tr>');
    });
    if(!list.length){
      rows.push('<tr><td>'+esc(state.ingredients[id].name)+'</td><td class="empty" colspan="6">No vendor prices logged</td></tr>');
    }
  });
  return '<div class="card"><div class="section-head"><h2>Vendors</h2><button class="btn primary" data-act="add-vendor">+ Add Vendor Price</button></div>'
    + '<p class="hint" style="margin:-6px 0 10px;">Cheapest known price is marked automatically. Click the star to set your chosen supplier — it won’t be overwritten even if a cheaper one shows up.</p>'
    + '<div class="table-wrap"><table><thead><tr><th>Ingredient</th><th>Vendor</th><th>Town</th><th class="right">Price</th><th>Stock</th><th>Pref.</th><th></th></tr></thead><tbody>'+rows.join('')+'</tbody></table></div>'
    + '</div>';
}
function stockBadge(s){
  if(s==='available') return '<span class="badge good">available</span>';
  if(s==='out') return '<span class="badge bad">out of stock</span>';
  return '<span class="badge muted">unknown</span>';
}
function openVendorModal(){
  var opts = ingredientOptionsHtml();
  var body = '<div class="field"><label>Ingredient</label><select id="vwIng">'+opts+'</select></div>'
    + '<div class="field-row">'
    + '<div class="field"><label>Vendor Name</label><input id="vwName" placeholder="Armadillo Market"></div>'
    + '<div class="field"><label>Town</label><input id="vwTown" placeholder="Armadillo"></div>'
    + '</div>'
    + '<div class="field-row">'
    + '<div class="field"><label>Price (blank = TBD)</label><input id="vwPrice" type="number" step="0.01" min="0"></div>'
    + '<div class="field"><label>Stock</label><select id="vwStock"><option value="unknown">Unknown</option><option value="available">Available</option><option value="out">Out of Stock</option></select></div>'
    + '</div>'
    + '<div class="actions"><button class="btn" id="vwCancel">Cancel</button><button class="btn primary" id="vwSave">Save</button></div>';
  openModal('Add Vendor Price', body, function(c){
    c.querySelector('#vwCancel').addEventListener('click', closeModal);
    c.querySelector('#vwSave').addEventListener('click', async function(){
      if(!requireDb()) return;
      var name = c.querySelector('#vwName').value.trim();
      if(!name) return alert('Vendor name is required.');
      var priceRaw = c.querySelector('#vwPrice').value;
      var data = {
        ingredientId: c.querySelector('#vwIng').value, vendorName:name,
        town: c.querySelector('#vwTown').value.trim(),
        price: priceRaw===''? null : Math.max(0, parseFloat(priceRaw)||0),
        stock: c.querySelector('#vwStock').value
      };
      var btn=c.querySelector('#vwSave'); btn.disabled=true; btn.textContent='Saving…';
      try{ await db.collection('vendors').add(data); closeModal(); }
      catch(e){ alert('Could not save: '+e.message); btn.disabled=false; btn.textContent='Save'; }
    });
  });
}

/* ================= INVENTORY ================= */
function viewInventory(){
  var ids = Object.keys(state.ingredients).sort(function(a,b){ return state.ingredients[a].name.localeCompare(state.ingredients[b].name); });
  var rows = ids.map(function(id){
    var ing = state.ingredients[id];
    var inv = state.inventory[id] || {qty:0, preferredVendorId:null};
    var res = ingCost(id);
    var value = (inv.qty||0)*res.cost;
    var vendorOpts = state.vendors.filter(function(v){return v.ingredientId===id;});
    var selectHtml = '<select data-act="set-pref-source" data-id="'+id+'"><option value="">cheapest available</option>'
      + vendorOpts.map(function(v){ return '<option value="'+v.id+'" '+(inv.preferredVendorId===v.id?'selected':'')+'>'+esc(v.vendorName)+(v.price!=null?' ('+fmt$(v.price)+')':'')+'</option>'; }).join('')
      + '</select>';
    return '<tr><td>'+esc(ing.name)+'</td><td class="muted">'+esc(ing.unit)+'</td>'
      + '<td><input type="number" step="any" min="0" value="'+(inv.qty||0)+'" data-act="set-qty" data-id="'+id+'"></td>'
      + '<td>'+selectHtml+'</td>'
      + '<td class="num right">'+(res.warn?'<span class="badge bad">no price</span>':fmt$(res.cost))+'</td>'
      + '<td class="num right">'+fmt$(value)+'</td></tr>';
  }).join('');
  var total = ids.reduce(function(sum,id){ var inv=state.inventory[id]||{qty:0}; return sum+(inv.qty||0)*ingCost(id).cost; },0);
  return '<div class="card"><div class="section-head"><h2>Inventory</h2><span class="badge muted">Total value: '+fmt$(total)+'</span></div>'
    + '<p class="hint" style="margin:-6px 0 10px;">Enter what you actually have on hand. Quantities save when you click away from the field.</p>'
    + '<div class="table-wrap"><table><thead><tr><th>Ingredient</th><th>Unit</th><th>On Hand</th><th>Preferred Source</th><th class="right">Unit Cost</th><th class="right">Value</th></tr></thead><tbody>'+rows+'</tbody></table></div>'
    + '</div>';
}

/* ================= PLANNER ================= */
function viewPlanner(){
  var recipes = Object.values(state.recipes).sort(function(a,b){return a.name.localeCompare(b.name);});
  var plan = computePlan();
  var rows = recipes.map(function(r){
    var t = state.plan.targets[r.id] || {enabled:false, qty:0};
    var runRow = plan.rows.filter(function(x){return x.recipe.id===r.id;})[0];
    return '<tr>'
      + '<td><input type="checkbox" data-act="plan-enabled" data-id="'+r.id+'" '+(t.enabled?'checked':'')+'></td>'
      + '<td>'+esc(r.name)+'</td>'
      + '<td><input type="number" min="0" step="1" style="width:5.5em" data-act="plan-qty" data-id="'+r.id+'" value="'+(t.qty||0)+'"></td>'
      + '<td class="num right">'+(runRow?runRow.crafts:'—')+'</td>'
      + '<td class="num right">'+(runRow?fmt$(runRow.runCost):'—')+'</td>'
      + '</tr>';
  }).join('');

  var shortRows = plan.shortages.map(function(s){
    var ing = state.ingredients[s.id];
    return '<tr'+(s.shortage>0?' style="background:var(--bad-bg)"':'')+'><td>'+esc(ing?ing.name:s.id)+'</td>'
      + '<td class="num right">'+s.required+'</td><td class="num right">'+s.onHand+'</td>'
      + '<td class="num right">'+(s.shortage>0?('<strong>'+s.shortage+'</strong>'):'0')+'</td></tr>';
  }).join('');

  var shortages = plan.shortages.filter(function(s){return s.shortage>0;});
  var orderRows = shortages.map(function(s){
    return '<tr><td>'+esc(ingName(s.id))+'</td><td class="num right">'+s.shortage+'</td><td>'+orderLineHtml(s.id, s.shortage)+'</td></tr>';
  }).join('');
  var orderTotal = shortages.reduce(function(sum,s){
    var last = resolvePurchaseSteps(s.id, s.shortage).slice(-1)[0];
    return sum + (last.type==='buy' ? last.vendor.price*last.qty : 0);
  }, 0);

  return '<div class="stack">'
    + '<div class="card"><div class="section-head"><h2>Production Planner</h2></div>'
    + '<p class="hint" style="margin:-6px 0 12px;">Check the recipes you’re running and set how many of each you want, then log your current Inventory — What To Order below fills in automatically.</p>'
    + '<div class="field-row" style="align-items:flex-end;">'
      + '<div class="field"><label>Set target for every enabled recipe</label><input id="bulkQty" type="number" min="0" step="1" value="100" style="width:7em"></div>'
      + '<div class="field"><button class="btn" id="bulkApply">Apply to enabled recipes</button></div>'
    + '</div>'
    + '<div class="table-wrap"><table><thead><tr><th>Plan</th><th>Recipe</th><th>Target Qty</th><th class="right">Crafts Needed</th><th class="right">Run Cost</th></tr></thead><tbody>'+rows+'</tbody></table></div>'
    + '</div>'
    + '<div class="card"><div class="section-head"><h2>What To Order</h2><span class="badge muted">Est. spend: '+fmt$(orderTotal)+'</span></div>'
    + '<p class="hint" style="margin:-6px 0 10px;">One line per shortage: buy from your preferred (or cheapest known) vendor, or go hunt it. Conversions (like Sugarcane → Sugar) are already worked out for you.</p>'
    + (orderRows ? '<div class="table-wrap"><table><thead><tr><th>Ingredient</th><th class="right">Short</th><th>Do This</th></tr></thead><tbody>'+orderRows+'</tbody></table></div>' : '<div class="empty">Nothing to order — you’re covered for everything checked above.</div>')
    + '</div>'
    + '<div class="card"><div class="section-head"><h2>Ingredient Detail</h2><p class="hint">Required vs. on-hand, before conversions.</p></div>'
    + (shortRows ? '<div class="table-wrap"><table><thead><tr><th>Ingredient</th><th class="right">Required</th><th class="right">On Hand</th><th class="right">Still Needed</th></tr></thead><tbody>'+shortRows+'</tbody></table></div>' : '<div class="empty">Enable at least one recipe above to see requirements.</div>')
    + '</div>'
  + '</div>';
}

/* ================= SETTINGS ================= */
function viewSettings(){
  var s = state.settings;
  return '<div class="stack">'
    + '<div class="card"><h2 style="margin-bottom:12px;">Pricing Rules</h2>'
      + '<div class="field-row">'
      + '<div class="field"><label>Server Price Cap</label><input id="stCap" type="number" step="0.01" min="0" value="'+s.priceCap+'"></div>'
      + '<div class="field"><label>Healthy Threshold (cost below)</label><input id="stHealthy" type="number" step="0.01" min="0" value="'+s.thresholdHealthy+'"></div>'
      + '<div class="field"><label>Problematic Threshold (cost above)</label><input id="stTight" type="number" step="0.01" min="0" value="'+s.thresholdTight+'"></div>'
      + '</div>'
      + '<button class="btn primary" id="saveSt1">Save Pricing Rules</button>'
    + '</div>'
    + '<div class="card"><h2 style="margin-bottom:6px;">Meat Processing</h2>'
      + '<p class="hint" style="margin:0 0 12px;">Prepared Meat Cut is priced specially instead of through the vendor list. Choose calculated (raw cost + butcher fee) or a flat manual override.</p>'
      + '<div class="field"><label>Meat mode</label><select id="stMode"><option value="calculated" '+(s.meatMode==='calculated'?'selected':'')+'>Calculated (raw + processing fee)</option><option value="override" '+(s.meatMode==='override'?'selected':'')+'>Manual override</option></select></div>'
      + '<div class="field-row">'
      + '<div class="field"><label>Raw meat cost / unit</label><input id="stRaw" type="number" step="0.01" min="0" value="'+s.meatRawCost+'"></div>'
      + '<div class="field"><label>Processing fee / unit</label><input id="stFee" type="number" step="0.01" min="0" value="'+s.meatProcessingFee+'"></div>'
      + '<div class="field"><label>Override cost / unit</label><input id="stOverride" type="number" step="0.01" min="0" value="'+s.meatOverrideCost+'"></div>'
      + '</div>'
      + '<button class="btn primary" id="saveSt2">Save Meat Settings</button>'
      + '<p class="foot-note">Special first batch (594 cuts for a flat $10 processing fee) was a one-off and isn’t used as the ongoing basis — set your normal-arrangement numbers above.</p>'
    + '</div>'
  + '</div>';
}

/* ---------- event wiring ---------- */
function requireDb(){
  if(!dbAvailable){ alert('This view has no live data connection, so nothing can be saved here. Open the published ledger link directly in Claude to edit.'); return false; }
  return true;
}
function wireApp(){
  var app = document.getElementById('app');
  app.onclick = async function(e){
    var b = e.target.closest('[data-act]');
    if(!b) return;
    var act = b.getAttribute('data-act'), id = b.getAttribute('data-id');
    if(act!=='add-recipe' && act!=='add-ing' && act!=='add-conv' && act!=='add-vendor' && !requireDb()) return;
    if(act==='add-recipe') openRecipeModal(null);
    else if(act==='edit-recipe') openRecipeModal(state.recipes[id]);
    else if(act==='del-recipe'){ if(confirm('Delete recipe "'+state.recipes[id].name+'"?')) await db.collection('recipes').doc(id).delete(); }
    else if(act==='add-ing') openIngredientModal(null);
    else if(act==='edit-ing') openIngredientModal(state.ingredients[id]);
    else if(act==='del-ing') await deleteIngredient(id);
    else if(act==='add-conv') openConversionModal();
    else if(act==='del-conv'){ if(confirm('Delete this conversion?')) await db.collection('conversions').doc(id).delete(); }
    else if(act==='add-vendor') openVendorModal();
    else if(act==='del-vendor'){
      if(confirm('Delete this vendor price?')){
        var v = state.vendors.filter(function(x){return x.id===id;})[0];
        await db.collection('vendors').doc(id).delete();
        if(v){
          var inv = state.inventory[v.ingredientId];
          if(inv && inv.preferredVendorId===id) await db.collection('inventory').doc(v.ingredientId).set({qty:inv.qty||0, preferredVendorId:null});
        }
      }
    }
    else if(act==='pref-vendor'){
      var vendorId = b.getAttribute('data-vendor');
      var inv2 = state.inventory[id] || {qty:0, preferredVendorId:null};
      var next = inv2.preferredVendorId===vendorId ? null : vendorId;
      await db.collection('inventory').doc(id).set({qty:inv2.qty||0, preferredVendorId:next});
    }
    else if(act==='bulkApplyNoop'){}
  };
  app.onchange = async function(e){
    var t = e.target;
    var act = t.getAttribute('data-act');
    if(!act) return;
    if(!requireDb()) return;
    var id = t.getAttribute('data-id');
    if(act==='toggle-active'){
      var r = state.recipes[id];
      await db.collection('recipes').doc(id).set(Object.assign({}, stripId(r), {active:t.checked}));
    } else if(act==='set-qty'){
      var val = Math.max(0, parseFloat(t.value)||0);
      var inv = state.inventory[id] || {qty:0, preferredVendorId:null};
      await db.collection('inventory').doc(id).set({qty:val, preferredVendorId:inv.preferredVendorId||null});
    } else if(act==='set-pref-source'){
      var inv2 = state.inventory[id] || {qty:0, preferredVendorId:null};
      await db.collection('inventory').doc(id).set({qty:inv2.qty||0, preferredVendorId:t.value||null});
    } else if(act==='plan-enabled'){
      var cur = state.plan.targets[id] || {enabled:false, qty:100};
      await db.doc('plan/current').update({targets:objWrap(id,{enabled:t.checked, qty:cur.qty||100})});
    } else if(act==='plan-qty'){
      var cur2 = state.plan.targets[id] || {enabled:false, qty:0};
      var qty = Math.max(0, parseFloat(t.value)||0);
      await db.doc('plan/current').update({targets:objWrap(id,{enabled:cur2.enabled, qty:qty})});
    }
  };
  if(activeTab==='planner'){
    var applyBtn = document.getElementById('bulkApply');
    if(applyBtn) applyBtn.addEventListener('click', async function(){
      if(!requireDb()) return;
      var qty = Math.max(0, parseFloat(document.getElementById('bulkQty').value)||0);
      var targets = {};
      Object.keys(state.recipes).forEach(function(id){
        var t = state.plan.targets[id];
        if(t && t.enabled) targets[id] = {enabled:true, qty:qty};
      });
      if(Object.keys(targets).length) await db.doc('plan/current').update({targets:targets});
    });
  }
  if(activeTab==='settings'){
    var s1 = document.getElementById('saveSt1');
    if(s1) s1.addEventListener('click', async function(){
      if(!requireDb()) return;
      await db.doc('settings/main').update({
        priceCap: parseFloat(document.getElementById('stCap').value)||0,
        thresholdHealthy: parseFloat(document.getElementById('stHealthy').value)||0,
        thresholdTight: parseFloat(document.getElementById('stTight').value)||0
      });
    });
    var s2 = document.getElementById('saveSt2');
    if(s2) s2.addEventListener('click', async function(){
      if(!requireDb()) return;
      await db.doc('settings/main').update({
        meatMode: document.getElementById('stMode').value,
        meatRawCost: parseFloat(document.getElementById('stRaw').value)||0,
        meatProcessingFee: parseFloat(document.getElementById('stFee').value)||0,
        meatOverrideCost: parseFloat(document.getElementById('stOverride').value)||0
      });
    });
  }
}
function stripId(obj){ var o=Object.assign({},obj); delete o.id; return o; }

boot();
})();
</script>
